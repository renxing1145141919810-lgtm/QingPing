name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      # GitHub-hosted Ubuntu runners already include Android SDK command-line tools.
      # Avoid setup-android@v3 here: its legacy "tools" package request now fails.
      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: QingPing-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
